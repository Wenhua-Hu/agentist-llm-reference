<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API 服务管理 · 实验账本</title>
<style>body{font:16px system-ui;max-width:1080px;margin:40px auto;padding:0 20px;background:#f5f7fb;color:#17263b}section{background:white;padding:20px;margin:16px 0;border-radius:12px}input,select,button{font:inherit;padding:8px;margin:4px;border:1px solid #b8c5d7;border-radius:6px}button{cursor:pointer;background:#e9f0ff}label{display:inline-block}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f7;padding:14px}small{display:block;color:#536378}#status{position:sticky;top:0;background:#fff4c8;padding:12px}</style>
<h1>API 服务管理</h1><p>实验账本：余额和价格用于项目验收，不产生真实支付。</p><div id="status" role="status">输入管理员凭据后连接。</div>
<section><h2>管理员连接</h2><input id="secret" type="password" placeholder="ADMIN_API_KEY" autocomplete="off"><button id="connect">连接</button><button id="logout">退出并清除</button><small>凭据只保留在本页内存；刷新即清除。通过 SSH tunnel 或 HTTPS 使用。</small></section>
<section><h2>用户与共享配额</h2><input id="name" placeholder="用户名称"><input id="balance" type="number" value="1000000" aria-label="余额microUSD"><input id="tokens" type="number" value="100000" aria-label="token总额度"><input id="rpm" type="number" value="60" aria-label="RPM"><input id="concurrency" type="number" value="4" aria-label="并发"><button id="create">创建用户</button><p><select id="tenant"></select><button id="refresh">刷新</button><select id="tenantstatus"><option value="active">启用</option><option value="disabled">停用</option></select><button id="limits">保存状态与上述配额</button></p><pre id="tenants">尚未连接</pre></section>
<section><h2>密钥</h2><input id="keyname" placeholder="用途，例如 Agent"><input id="expiry" type="datetime-local" aria-label="过期时间（本地时区）"><button id="issue">创建密钥</button><select id="key"></select><button id="rotate">轮换（立即撤销旧密钥）</button><button id="revoke">撤销</button><pre id="once">新密钥只在创建或轮换时显示一次。</pre><button id="clear">清除新密钥显示</button><pre id="keys"></pre></section>
<section><h2>实验余额调整</h2><input id="delta" type="number" value="100000" aria-label="调整microUSD"><input id="reason" placeholder="调整原因"><button id="credit">提交调整</button><small>同一次网络重试复用幂等键，避免重复充值。</small></section>
<section><h2>版本化价格</h2><input id="model" placeholder="模型ID"><input id="inputprice" type="number" value="2" aria-label="输入microUSD每token"><input id="outputprice" type="number" value="6" aria-label="输出microUSD每token"><button id="price">发布新价格版本</button><pre id="prices"></pre></section>
<section><h2>用量与账单</h2><button id="usage">刷新账单</button><pre id="bills"></pre><button id="more">下一页</button></section><section><h2>操作审计</h2><pre id="audit"></pre><button id="moreaudit">下一页审计</button></section>
<script>
let credential='',next=null,auditNext=null,creditAttempt=null;const $=id=>document.getElementById(id),tid=()=>$('tenant').value,expiry=()=>$('expiry').value?new Date($('expiry').value).toISOString():null;
async function api(path,method='GET',data,idem){if(!credential)throw Error('请先连接管理员');let r=await fetch(path,{method,headers:{Authorization:'Bearer '+credential,'Content-Type':'application/json',...(idem?{'Idempotency-Key':idem}:{})},body:data===undefined?undefined:JSON.stringify(data)});let value=await r.json();if(!r.ok)throw Error(value.error?.code||'请求失败 '+r.status);return value;}
function show(id,value){$(id).textContent=JSON.stringify(value,null,2)}
function bind(id,fn){$(id).onclick=async()=>{try{$('status').textContent='处理中…';await fn();$('status').textContent='完成'}catch(e){$('status').textContent=e.message}}}
async function detail(){if(!tid())return;let ks=await api('/admin/tenants/'+tid()+'/keys');show('keys',ks);$('key').replaceChildren(...ks.items.map(k=>new Option(k.name+' '+k.masked_key+' '+k.status,k.key_id)));await bills();await audit();}
async function refresh(){let ts=await api('/admin/tenants');let old=tid();show('tenants',ts);$('tenant').replaceChildren(...ts.items.map(t=>new Option(t.name+' · '+t.status,t.tenant_id)));if(ts.items.some(t=>t.tenant_id===old))$('tenant').value=old;let ps=await api('/admin/pricing');show('prices',ps);if(ps.items.length)$('model').value=ps.items[0].model;await detail();}
async function bills(cursor=0){if(!tid())return;let v=await api('/admin/usage?tenant_id='+encodeURIComponent(tid())+'&cursor='+cursor);next=v.next_cursor;show('bills',v)}
async function audit(cursor=0){let v=await api('/admin/audit?tenant_id='+encodeURIComponent(tid())+'&cursor='+cursor);auditNext=v.next_cursor;show('audit',v)}
bind('connect',async()=>{credential=$('secret').value;$('secret').value='';await refresh()});bind('logout',async()=>{credential='';for(let id of ['tenants','keys','once','prices','bills','audit'])$(id).textContent='';$('tenant').replaceChildren();$('key').replaceChildren()});bind('refresh',refresh);$('tenant').onchange=()=>detail().catch(e=>$('status').textContent=e.message);
bind('create',async()=>{let v=await api('/admin/tenants','POST',{name:$('name').value,balance_micro_usd:Number($('balance').value),token_limit:Number($('tokens').value),rpm_limit:Number($('rpm').value),concurrency_limit:Number($('concurrency').value)});await refresh();$('tenant').value=v.tenant_id;await detail()});
bind('limits',async()=>{await api('/admin/tenants/'+tid(),'PATCH',{status:$('tenantstatus').value,token_limit:Number($('tokens').value),rpm_limit:Number($('rpm').value),concurrency_limit:Number($('concurrency').value)});await refresh()});
bind('issue',async()=>{show('once',await api('/admin/tenants/'+tid()+'/keys','POST',{name:$('keyname').value,expires_at:expiry()}));await detail()});bind('rotate',async()=>{show('once',await api('/admin/keys/'+$('key').value+'/rotate','POST',{expires_at:expiry()}));await detail()});bind('revoke',async()=>{await api('/admin/keys/'+$('key').value+'/revoke','POST',{});await detail()});bind('clear',async()=>{$('once').textContent='已清除'});
bind('credit',async()=>{let body={delta_micro_usd:Number($('delta').value),reason:$('reason').value},signature=tid()+JSON.stringify(body);if(!creditAttempt||creditAttempt.signature!==signature)creditAttempt={signature,key:crypto.randomUUID()};await api('/admin/tenants/'+tid()+'/credits','POST',body,creditAttempt.key);creditAttempt=null;await refresh()});
bind('price',async()=>{await api('/admin/pricing','PUT',{model:$('model').value,input_micro_usd_per_token:Number($('inputprice').value),output_micro_usd_per_token:Number($('outputprice').value)});await refresh()});bind('usage',()=>bills());bind('more',()=>next?bills(next):Promise.resolve());bind('moreaudit',()=>auditNext?audit(auditNext):Promise.resolve());
</script></html>
